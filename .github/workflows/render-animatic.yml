# ⚠️ Runner 钉版：ubuntu-24.04（当前渲染链路已验证的镜像）；ubuntu-latest 自 2026-10-19 起迁移 Ubuntu 26（actions/runner-images#14748），升级前勿改回
name: render-animatic
# 云端渲染 animatic（workflow_dispatch）——bundle 一次 → 分段矩阵 → concat 帧级对齐 → 终验
# 分段 = 片头 120f + N 镜（内容帧 +120 偏移）+ 片尾 180f，单段失败只重跑单段
on:
  workflow_dispatch:
    inputs:
      scope:
        description: '渲染范围：all = 全片 + 汇总；actN = 只渲该幕；intro-outro = 只渲片头片尾'
        type: choice
        required: false
        default: all
        options:
          - all
          - intro-outro
          - act1
          - act2
          - act3
          - act4
          - act5
          - act6
          - act7
          - act8
      shots:
        description: '高级：镜号子集（空格分隔，如 "s03 s17"）；留空 = 按 scope'
        required: false
        default: ''
      unit:
        description: '影片 slug'
        type: choice
        required: false
        default: 'wuh-site-intro-v2'
        options:
          - wuh-site-intro-v2
          - zhi-guo-xiang
          - site-film
          - making-of-zhi-guo-xiang
          - wuh-site-intro-v3

concurrency:
  group: render-animatic
  cancel-in-progress: false

jobs:
  plan:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      unit: ${{ steps.plan.outputs.unit }}
      segments: ${{ steps.plan.outputs.segments }}
      full: ${{ steps.plan.outputs.full }}
    steps:
      - uses: actions/checkout@v7
      - id: plan
        env:
          SHOTS_INPUT: ${{ github.event.inputs.shots }}
          SCOPE_INPUT: ${{ github.event.inputs.scope }}
          UNIT_INPUT: ${{ github.event.inputs.unit }}
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const unit = (process.env.UNIT_INPUT || 'wuh-site-intro-v2').trim() || 'wuh-site-intro-v2';
          const scope = (process.env.SCOPE_INPUT || 'all').trim() || 'all';
          const m = JSON.parse(fs.readFileSync(`videos/${unit}/shots-manifest.json`, 'utf8'));
          const INTRO = 120, OUTRO = 180;
          const custom = (process.env.SHOTS_INPUT || '').split(/\s+/).filter(Boolean);
          const actMatch = scope.match(/^act(\d+)$/);
          const pick = custom.length > 0
            ? (s) => custom.includes(s.id)
            : scope === 'all'
              ? () => true
              : actMatch
                ? (s) => s.act === Number(actMatch[1])
                : () => false;
          const segments = [{ id: 'intro', start: 0, end: INTRO - 1 }];
          for (const s of m.shots) {
            if (!pick(s)) continue;
            segments.push({ id: s.id, start: s.startFrame + INTRO, end: s.startFrame + s.durationFrames + INTRO - 1 });
          }
          segments.push({ id: 'outro', start: m.totalFrames + INTRO, end: m.totalFrames + INTRO + OUTRO - 1 });
          const full = custom.length === 0 && scope === 'all';
          fs.writeFileSync('segments.json', JSON.stringify({ unit, scope, segments, full, total: m.totalFrames + INTRO + OUTRO }, null, 2));
          console.log(`unit=${unit} scope=${scope} segments=${segments.length} full=${full} total=${m.totalFrames + INTRO + OUTRO}`);
          NODE
          echo "unit=$(jq -r .unit segments.json)" >> "$GITHUB_OUTPUT"
          echo "segments=$(jq -c .segments segments.json)" >> "$GITHUB_OUTPUT"
          echo "full=$(jq -r .full segments.json)" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v7
        with: { name: segments-plan, path: segments.json, retention-days: 7 }

  bundle:
    needs: plan
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with: { version: 10 }
      - uses: actions/setup-node@v7
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - name: Bundle once
        run: |
          cat > bundle.mjs <<'EOF'
          import { cpSync } from 'node:fs';
          import { bundle } from '@remotion/bundler';
          const dir = await bundle({ entryPoint: 'src/index.ts' });
          cpSync(dir, 'ci-bundle', { recursive: true });
          console.log(`bundle → ci-bundle`);
          EOF
          node bundle.mjs
          ls ci-bundle/index.html
      - uses: actions/upload-artifact@v7
        with: { name: remotion-bundle, path: ci-bundle, retention-days: 7 }

  segments:
    needs: [plan, bundle]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      matrix:
        seg: ${{ fromJSON(needs.plan.outputs.segments) }}
      max-parallel: 20
      fail-fast: false
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with: { version: 10 }
      - uses: actions/setup-node@v7
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Install CJK fonts + family aliases
        run: |
          sudo apt-get install -y fonts-noto-cjk fonts-noto-cjk-extra
          sudo mkdir -p /etc/fonts
          printf '%s\n' '<?xml version="1.0"?>' '<!DOCTYPE fontconfig SYSTEM "fonts.dtd">' '<fontconfig>' '  <alias><family>PingFang SC</family><accept><family>Noto Sans CJK SC</family></accept></alias>' '  <alias><family>Songti SC</family><accept><family>Noto Serif CJK SC</family></accept></alias>' '  <alias><family>Menlo</family><accept><family>Noto Sans Mono CJK SC</family></accept></alias>' '</fontconfig>' | sudo tee /etc/fonts/local.conf > /dev/null
          fc-cache -f
          fc-match "PingFang SC" && fc-match "Songti SC" && fc-match "Menlo" # 别名生效自证
          fc-list :lang=zh | grep -q . || { echo '缺少中文字体——mono 语境会渲成方框'; exit 1; } # 字体哨兵
      - uses: actions/download-artifact@v8
        with: { name: remotion-bundle, path: ci-bundle }
      - name: Render segment
        env:
          UNIT: ${{ needs.plan.outputs.unit }}
          SEG: ${{ matrix.seg.id }}
          START: ${{ matrix.seg.start }}
          END: ${{ matrix.seg.end }}
        run: |
          mkdir -p out
          cat > render-seg.mjs <<'EOF'
          import { readFileSync } from 'node:fs';
          import { renderMedia } from '@remotion/renderer';
          const [seg, start, end] = process.argv.slice(2);
          const unit = process.env.UNIT;
          const pascal = unit.split('-').map((p) => p[0].toUpperCase() + p.slice(1)).join('');
          const m = JSON.parse(readFileSync(`videos/${unit}/shots-manifest.json`, 'utf8'));
          const total = m.totalFrames + 120 + 180;
          await renderMedia({
            composition: { id: `${pascal}Animatic`, width: 1920, height: 1080, fps: 30, durationInFrames: total },
            serveUrl: 'ci-bundle',
            codec: 'h264',
            crf: 16,
            outputLocation: `out/seg-${seg}.mp4`,
            frameRange: [Number(start), Number(end)],
            browserExecutable: '/usr/bin/google-chrome-stable',
            concurrency: 1,
          });
          EOF
          node render-seg.mjs "$SEG" "$START" "$END"
          want=$((END - START + 1))
          got=$(ffprobe -v error -select_streams v:0 -show_entries stream=nb_frames -of default=noprint_wrappers=1:nokey=1 "out/seg-$SEG.mp4")
          echo "seg=$SEG frames=$got want=$want"
          [ "$got" = "$want" ]
      - uses: actions/upload-artifact@v7
        with:
          name: seg-${{ matrix.seg.id }}
          path: out/seg-${{ matrix.seg.id }}.mp4
          retention-days: 90
          if-no-files-found: error

  assemble:
    needs: [plan, segments]
    if: needs.plan.outputs.full == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      UNIT: ${{ needs.plan.outputs.unit }}
    steps:
      - uses: actions/checkout@v7
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - uses: actions/download-artifact@v8
        with: { pattern: 'seg-*', path: out/segs, merge-multiple: true }
      - uses: actions/download-artifact@v8
        with: { name: segments-plan, path: plan }
      - name: Concat + verify
        run: |
          cat > assemble.mjs <<'EOF'
          import { execFileSync } from 'node:child_process';
          import { existsSync, readFileSync } from 'node:fs';
          const { segments } = JSON.parse(readFileSync('plan/segments.json', 'utf8'));
          const unit = process.env.UNIT;
          const files = segments.map((s) => `out/segs/seg-${s.id}.mp4`);
          const missing = files.filter((f) => !existsSync(f));
          if (missing.length) { console.error('缺段:', missing.join(', ')); process.exit(1); }
          const args = [];
          for (const f of files) args.push('-i', f);
          const chains = files.map((_, i) => `[${i}:v]trim=end_frame=${segments[i].end - segments[i].start + 1},setpts=PTS-STARTPTS[v${i}]`).join(';');
          const graph = `${chains};${files.map((_, i) => `[v${i}]`).join('')}concat=n=${files.length}:v=1:a=0[cat]`;
          const d = new Date();
          const stamp = `${d.getFullYear()}${String(d.getMonth() + 1).padStart(2, '0')}${String(d.getDate()).padStart(2, '0')}${String(d.getHours()).padStart(2, '0')}${String(d.getMinutes()).padStart(2, '0')}${String(d.getSeconds()).padStart(2, '0')}`;
          const out = `out/A${stamp}-${unit}.mp4`;
          args.push('-filter_complex', graph, '-map', '[cat]', '-r', '30', '-vsync', 'cfr', '-c:v', 'libx264', '-preset', 'veryfast', '-crf', '16', '-pix_fmt', 'yuv420p', out);
          execFileSync('ffmpeg', ['-y', ...args], { stdio: 'inherit' });
          const frames = Number(execFileSync('ffprobe', ['-v', 'error', '-select_streams', 'v:0', '-show_entries', 'stream=nb_frames', '-of', 'default=noprint_wrappers=1:nokey=1', out], { encoding: 'utf8' }).trim());
          const total = Number(JSON.parse(readFileSync(`videos/${unit}/shots-manifest.json`, 'utf8')).totalFrames) + 120 + 180;
          console.log(`final frames=${frames} total=${total}`);
          if (frames !== total) process.exit(1);
          EOF
          node assemble.mjs
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ needs.plan.outputs.unit }}-animatic
          path: out/A*-${{ needs.plan.outputs.unit }}.mp4
          retention-days: 90
          if-no-files-found: error
