name: render-animatic
# 云端渲染 animatic（workflow_dispatch）——整片 7958f 或指定帧段；产物 artifact 下载
# 用途：本机段错误风暴期间出 animatic 样片/整片；字体走 CI 安装的 Noto CJK（字形与品牌字体略有差异）
on:
  workflow_dispatch:
    inputs:
      frames:
        description: '帧段（如 0-299；空 = 整片 7958f）'
        required: false
        default: ''
      composition:
        description: 'Composition ID'
        required: false
        default: 'WuhSiteIntroV2Animatic'

concurrency:
  group: render-animatic
  cancel-in-progress: false

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 10 }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg fontconfig
      - name: Install CJK fonts + family aliases
        run: |
          sudo apt-get install -y fonts-noto-cjk fonts-noto-cjk-extra
          sudo mkdir -p /etc/fonts
          printf '%s\n' '<?xml version="1.0"?>' '<!DOCTYPE fontconfig SYSTEM "fonts.dtd">' '<fontconfig>' '  <alias><family>PingFang SC</family><accept><family>Noto Sans CJK SC</family></accept></alias>' '  <alias><family>Songti SC</family><accept><family>Noto Serif CJK SC</family></accept></alias>' '  <alias><family>Menlo</family><accept><family>Noto Sans Mono CJK SC</family></accept></alias>' '</fontconfig>' | sudo tee /etc/fonts/local.conf > /dev/null
          fc-cache -f
          fc-match "PingFang SC" && fc-match "Songti SC" && fc-match "Menlo"
      - run: google-chrome-stable --version
      - name: Render
        env:
          FRAMES: ${{ github.event.inputs.frames }}
          COMP: ${{ github.event.inputs.composition }}
        run: |
          mkdir -p out
          ARGS="--crf=16 --browser-executable=/usr/bin/google-chrome-stable --port=3211"
          if [ -n "$FRAMES" ]; then
            npx remotion render src/index.ts "$COMP" out/wuh-site-intro-v2-animatic.mp4 --frames="$FRAMES" $ARGS
          else
            npx remotion render src/index.ts "$COMP" out/wuh-site-intro-v2-animatic.mp4 $ARGS
          fi
      - name: ffprobe
        run: ffprobe -v error -select_streams v:0 -show_entries stream=nb_frames,duration -of default=noprint_wrappers=1 out/wuh-site-intro-v2-animatic.mp4
      - uses: actions/upload-artifact@v4
        with:
          name: wuh-site-intro-v2-animatic
          path: out/wuh-site-intro-v2-animatic.mp4
          retention-days: 90
          if-no-files-found: error
