name: render-film
# B 轨（shot-spec §5）：GitHub Actions 云端渲染——一镜一任务编排：
#   bundle 任务（预打包 + 生成镜清单）→ shots 矩阵任务（一镜一个 job，fail-fast 关闭，互不牵连）
#   → assemble 汇总任务（统一清点：缺镜明确列出，全绿才拼接 + 音轨 + 三重终验）。
# 单镜重跑：Actions「Re-run failed jobs」只重跑红镜；或 workflow_dispatch 传镜号子集。
# ⚠️ 字体口径：serif 落 Noto Serif SC，sans/mono 为替代字体——CI 成片用于链路验证与兜底出片，
#    像素定稿以本机为准；字体资产化（入仓 + @remotion/fonts）后此漂移消除。
on:
  workflow_dispatch:
    inputs:
      shots:
        description: '镜号子集（空格分隔，如 "s03 s17"；空 = 全部 45 镜 + 汇总）'
        required: false
        default: ''

concurrency:
  group: render-film
  cancel-in-progress: false

jobs:
  bundle:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      shots: ${{ steps.plan.outputs.shots }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 10 }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: npx remotion browser ensure
      - id: plan
        env:
          SHOTS_INPUT: ${{ github.event.inputs.shots }}
        run: |
          LIST=$(node -e "const m=require('./videos/site-film/shots-manifest.json');const i=process.env.SHOTS_INPUT||'';process.stdout.write(JSON.stringify(i?i.split(/\s+/).filter(Boolean):m.shots.map(s=>s.id)))")
          echo "shots=$LIST" >> "$GITHUB_OUTPUT"
          echo "镜任务清单: $LIST"
      - run: node scripts/render-film.mjs --bundle-only
      - name: Read bundle path
        id: bundepath
        run: echo "dir=$(cat out/bundle-path.txt)" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        with:
          name: remotion-bundle
          path: ${{ steps.bundepath.outputs.dir }}
          retention-days: 7 # 运行内中转物，仅本次 run 有用

  shots:
    needs: bundle
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      matrix:
        shot: ${{ fromJSON(needs.bundle.outputs.shots) }}
      max-parallel: 4
      fail-fast: false # 一镜红不影响其余镜——独立任务，独立重跑
    env:
      CHROME_EXECUTABLE: none
      RENDER_CONCURRENCY: '1' # 每任务只渲一镜，单 Chrome 即可；总并发 = max-parallel
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 10 }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: npx remotion browser ensure
      - uses: actions/download-artifact@v4
        with: { name: remotion-bundle, path: ci-bundle }
      - name: Locate bundle
        id: loc
        run: echo "dir=$(dirname "$(find ci-bundle -name index.html | head -1)")" >> "$GITHUB_OUTPUT"
      - run: node scripts/render-film.mjs --only ${{ matrix.shot }} --bundle-dir "${{ steps.loc.outputs.dir }}"
      - uses: actions/upload-artifact@v4
        with:
          name: shot-${{ matrix.shot }}
          path: out/shots/site-film/${{ matrix.shot }}-*.mp4
          retention-days: 90 # 仓库上限
          if-no-files-found: error

  assemble:
    needs: shots
    if: always() # 有红镜也要跑：统一清点、明确列缺，不静默
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CHROME_EXECUTABLE: none
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 10 }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: npx remotion browser ensure
      - uses: actions/download-artifact@v4
        with: { pattern: 'shot-*', path: out/shots/site-film, merge-multiple: true }
      - uses: actions/download-artifact@v4
        with: { name: remotion-bundle, path: ci-bundle }
      - name: Locate bundle
        id: loc
        run: echo "dir=$(dirname "$(find ci-bundle -name index.html | head -1)")" >> "$GITHUB_OUTPUT"
      - name: Count collected shots
        run: echo "已收镜产物 $(ls out/shots/site-film/*.mp4 2>/dev/null | wc -l) 个"
      - run: node scripts/render-film.mjs --assemble --bundle-dir "${{ steps.loc.outputs.dir }}" # 缺镜在此明确列出
      - uses: actions/upload-artifact@v4
        with:
          name: site-film-final
          path: out/site-film-final.mp4
          retention-days: 90 # 仓库上限
          if-no-files-found: error
