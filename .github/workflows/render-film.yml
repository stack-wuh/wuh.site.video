# ⚠️ Runner 钉版：ubuntu-24.04（当前渲染链路已验证的镜像）；ubuntu-latest 自 2026-10-19 起迁移 Ubuntu 26（actions/runner-images#14748），升级前勿改回
name: render-film
# B 轨（shot-spec §5）：GitHub Actions 云端渲染——一镜一任务编排：
#   bundle 任务（预打包 + 生成镜清单）→ shots 矩阵任务（一镜一个 job，fail-fast 关闭，互不牵连）
#   → assemble 汇总任务（统一清点：缺镜明确列出，全绿才拼接 + 音轨 + 三重终验）。
# 单镜重跑：Actions「Re-run failed jobs」只重跑红镜；或 workflow_dispatch 传镜号子集。
# ⚠️ 字体口径：serif 落 Noto Serif SC，sans/mono 为替代字体——CI 成片用于链路验证与兜底出片，
#    像素定稿以本机为准；字体资产化（入仓 + @remotion/fonts）后此漂移消除。
on:
  workflow_dispatch:
    inputs:
      film:
        # 不用 type: choice 下拉：options 平台只支持静态枚举，而单元随片子增长——
        # 合法单元以 videos/*/shots-manifest.json 为真源，bundle 首步动态校验拦截。
        description: '视频单元 slug（合法值见 bundle 校验输出，如 site-film、zhi-guo-xiang）'
        required: false
        default: 'site-film'
      shots:
        description: '镜号子集（空格分隔，如 "s03 s17"；空 = 全部镜 + 汇总）'
        required: false
        default: ''

env:
  FILM: ${{ github.event.inputs.film || 'site-film' }}

concurrency:
  group: render-film-${{ github.event.inputs.film || 'site-film' }}
  cancel-in-progress: false

jobs:
  bundle:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    outputs:
      shots: ${{ steps.plan.outputs.shots }}
    steps:
      - uses: actions/checkout@v7
      # FILM 动态校验：合法单元 = videos/*/shots-manifest.json（真源），填错在此红掉并列出可用值，
      # 不等 node require 报 ENOENT。新单元只要 sync 过 manifest 即自动可渲，无需改本文件。
      - name: 校验 FILM 输入
        run: |
          VALID=$(ls -d videos/*/shots-manifest.json | cut -d/ -f2 | paste -sd' ' -)
          case " $VALID " in
            *" $FILM "*) echo "视频单元 '$FILM' ✓（可用：$VALID）" ;;
            *) echo "::error::未知视频单元 '$FILM'。可用单元：$VALID"; exit 1 ;;
          esac
      - uses: pnpm/action-setup@v6
        with: { version: 10 }
      - uses: actions/setup-node@v7
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      # 类型门：bundle 是最早的失败点，类型错在此拦下，不浪费数十个矩阵渲镜 job。
      # 只查在制单元（tsconfig.ci.json）——全仓 pnpm typecheck 会被 videos/wuh-site-intro-v2 的
      # 8 处存量 TS2339（调色键名不存在）顶红，属该单元既有问题；其修好后换回 pnpm typecheck。
      - run: pnpm typecheck:ci
      - run: google-chrome-stable --version
      - id: plan
        env:
          SHOTS_INPUT: ${{ github.event.inputs.shots }}
        run: |
          LIST=$(node -e "const m=require('./videos/'+process.env.FILM+'/shots-manifest.json');const i=process.env.SHOTS_INPUT||'';process.stdout.write(JSON.stringify(i?i.split(/\s+/).filter(Boolean):m.shots.map(s=>s.id)))")
          echo "shots=$LIST" >> "$GITHUB_OUTPUT"
          echo "镜任务清单: $LIST"
      - run: node scripts/render-film.mjs --bundle-only --unit "$FILM"
      - name: Read bundle path
        id: bundepath
        run: echo "dir=$(cat out/bundle-path.txt)" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v7
        with:
          name: remotion-bundle
          path: ${{ steps.bundepath.outputs.dir }}
          retention-days: 7 # 运行内中转物，仅本次 run 有用

  shots:
    needs: bundle
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      matrix:
        shot: ${{ fromJSON(needs.bundle.outputs.shots) }}
      max-parallel: 20 # 免费私有仓并发上限（45 镜 ≈ 3 波）
      fail-fast: false # 一镜红不影响其余镜——独立任务，独立重跑
    env:
      CHROME_EXECUTABLE: /usr/bin/google-chrome-stable # 完整版 Chrome：headless-shell 的 blend/色彩管理有差异（CI 抽帧实证偏色）
      RENDER_CONCURRENCY: '1' # 每任务只渲一镜，单 Chrome 即可；总并发 = max-parallel
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with: { version: 10 }
      - uses: actions/setup-node@v7
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg fontconfig # runner 无预装 ffprobe——INV-S5 校验必需（CI 五跑实证）
      - name: Install CJK fonts + family aliases
        run: |
          sudo apt-get install -y fonts-noto-cjk fonts-noto-cjk-extra
          sudo mkdir -p /etc/fonts
          printf '%s\n' '<?xml version="1.0"?>' '<!DOCTYPE fontconfig SYSTEM "fonts.dtd">' '<fontconfig>' '  <alias><family>PingFang SC</family><accept><family>Noto Sans CJK SC</family></accept></alias>' '  <alias><family>Songti SC</family><accept><family>Noto Serif CJK SC</family></accept></alias>' '  <alias><family>Menlo</family><accept><family>Noto Sans Mono CJK SC</family></accept></alias>' '</fontconfig>' | sudo tee /etc/fonts/local.conf > /dev/null
          fc-cache -f
          fc-match "PingFang SC" && fc-match "Songti SC" && fc-match "Menlo" # 别名生效自证
      - run: google-chrome-stable --version
      - uses: actions/download-artifact@v8
        with: { name: remotion-bundle, path: ci-bundle }
      - name: Locate bundle
        id: loc
        run: echo "dir=$(dirname "$(find ci-bundle -name index.html | head -1)")" >> "$GITHUB_OUTPUT"
      - run: node scripts/render-film.mjs --only ${{ matrix.shot }} --bundle-dir "${{ steps.loc.outputs.dir }}" --unit "$FILM"
      - uses: actions/upload-artifact@v7
        with:
          name: shot-${{ matrix.shot }}
          path: out/shots/${{ env.FILM }}/${{ matrix.shot }}-*.mp4
          retention-days: 90 # 仓库上限
          if-no-files-found: error

  assemble:
    needs: shots
    if: always() && github.event.inputs.shots == '' # 子集出片（shots 非空）不汇总：assemble 要求全 52 镜缓存
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      CHROME_EXECUTABLE: /usr/bin/google-chrome-stable # 完整版 Chrome：headless-shell 的 blend/色彩管理有差异（CI 抽帧实证偏色）
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with: { version: 10 }
      - uses: actions/setup-node@v7
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: google-chrome-stable --version
      - uses: actions/download-artifact@v8
        with:
          pattern: 'shot-*'
          path: out/shots/${{ env.FILM }}
          merge-multiple: true
      - uses: actions/download-artifact@v8
        with: { name: remotion-bundle, path: ci-bundle }
      - name: Locate bundle
        id: loc
        run: echo "dir=$(dirname "$(find ci-bundle -name index.html | head -1)")" >> "$GITHUB_OUTPUT"
      - name: Count collected shots
        run: echo "已收镜产物 $(ls out/shots/$FILM/*.mp4 2>/dev/null | wc -l) 个"
      - run: node scripts/render-film.mjs --assemble --bundle-dir "${{ steps.loc.outputs.dir }}" --unit "$FILM" # 缺镜在此明确列出
      - name: Resolve final artifact name
        id: final
        run: echo "name=$(basename "$(ls out/*-${FILM}.mp4 | head -1)" .mp4)" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.final.outputs.name }}
          path: out/*-${{ env.FILM }}.mp4 # 规范名 {yyyyMMdd}{HHmmss}-{项目名}.mp4；artifact 名与成片同名（不含 .mp4）
          retention-days: 90 # 仓库上限
          if-no-files-found: error
